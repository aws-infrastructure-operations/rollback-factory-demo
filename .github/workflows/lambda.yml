name: lambda

# PRs: typecheck, unit tests, synth. Then the PR's own environment, pr-<number>: deploy-aws-lambda-pr-<n>
# (service-lambda-pr-<n>) is deployed (and updated on each push), and the integration tests run on its
# integration alias. Closing the PR (merged or not) deletes the stack; pr-environments-cleanup.yml
# catches any left behind.
# main / manual, per environment (dev -> prod): deploy to the integration
# alias -> integration tests -> promote live. Failed tests stop the run with live untouched.
# Alarms after a deploy are handled in AWS (errors alarm -> SNS -> rollback function), not here.
# After dev, the "lambda rollback to commit" dropdown is refreshed from dev's deployed commits.

on:
  push:
    branches: [main]
    paths:
      - deploy-aws-lambda/**
      - .github/workflows/lambda*.yml
      - .github/actions/lambda-deploy/**
      - "!**/*.md"
      # Regenerated by the update-commit-dropdown job below.
      - "!.github/workflows/lambda-rollback-to-commit.yml"
  pull_request:
    # closed: deletes the PR's environment
    types: [opened, synchronize, reopened, closed]
    paths:
      - deploy-aws-lambda/**
      - .github/workflows/lambda*.yml
      - .github/actions/lambda-deploy/**
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      promote_to_prod:
        description: Deploy to prod after the earlier environments are green
        type: boolean
        default: true

# One run of this workflow at a time; a new run waits for the running one. Each pull request has its
# own group (its environment is deployed, and deleted on close, one run at a time), so PRs never wait
# for each other or for (or replace) a waiting deploy from main.
concurrency:
  group: lambda-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'deploy' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy-aws-lambda
    env:
      # no credentials here: synth only needs a region
      AWS_REGION: eu-central-1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy-aws-lambda/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Synth dev and prod
        run: |
          npx cdk synth -c env=dev -q -o cdk.out/dev
          npx cdk synth -c env=prod -q -o cdk.out/prod

  # The PR's own copy of the stack, tested like dev's integration alias but without promotion, alarm
  # actions or the rollback service's archive. Not for PRs from forks: they get no secrets.
  pr-environment:
    name: pr environment
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: ubuntu-latest
    # dev's credentials and region (same account)
    environment: dev
    timeout-minutes: 30
    defaults:
      run:
        working-directory: deploy-aws-lambda
    env:
      LAMBDA_ENV: pr-${{ github.event.pull_request.number }}
      FUNCTION_NAME: service-lambda-pr-${{ github.event.pull_request.number }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: each version's description is the last commit that touched the service code.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy-aws-lambda/package-lock.json
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy deploy-aws-lambda-${{ env.LAMBDA_ENV }}
        run: npx cdk deploy -c env="$LAMBDA_ENV" --require-approval never

      - name: Read the version integration serves
        id: integration_version
        run: |
          version="$(aws lambda get-alias --function-name "$FUNCTION_NAME" --name integration --query FunctionVersion --output text)"
          echo "Testing $FUNCTION_NAME version $version on the integration alias"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Integration tests on the integration alias
        id: integration
        env:
          LAMBDA_ALIAS: integration
          LAMBDA_VERSION: ${{ steps.integration_version.outputs.version }}
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee integration-tests.log

      - name: Summary
        if: always()
        env:
          VERSION: ${{ steps.integration_version.outputs.version }}
        run: |
          {
            if [[ "${{ steps.integration.outcome }}" == success ]]; then
              echo "### :white_check_mark: $FUNCTION_NAME: integration tests passed on version $VERSION"
            elif [[ "${{ steps.integration.outcome }}" == failure ]]; then
              echo "### :x: $FUNCTION_NAME: integration tests failed on version $VERSION"
              echo '<details open><summary>Test output (last 100 lines)</summary>'
              echo
              echo '```'
              tail -n 100 integration-tests.log
              echo '```'
              echo '</details>'
            else
              echo "### $FUNCTION_NAME: not deployed"
            fi
            echo
            echo "Deleted when the PR is closed."
          } >> "$GITHUB_STEP_SUMMARY"

  pr-environment-delete:
    name: delete pr environment
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: ./.github/actions/pr-environment-delete
        with:
          stack-name: deploy-aws-lambda-pr-${{ github.event.pull_request.number }}

  deploy-dev:
    name: deploy dev
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    # Shared with the manual rollback workflows: a deploy and a rollback never race on the alias.
    concurrency:
      group: lambda-release-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: each version's description is the last commit that touched the service code.
          fetch-depth: 0
      - uses: ./.github/actions/lambda-deploy
        with:
          environment: dev
          aws-region: ${{ vars.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy-prod:
    name: deploy prod
    if: github.event_name == 'push' || inputs.promote_to_prod
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30
    # Shared with the manual rollback workflows: a deploy and a rollback never race on the alias.
    concurrency:
      group: lambda-release-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: each version's description is the last commit that touched the service code.
          fetch-depth: 0
      - uses: ./.github/actions/lambda-deploy
        with:
          environment: prod
          aws-region: ${{ vars.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  # Refreshes the "lambda rollback to commit" dropdown with dev's last 5 deployed commits. GitHub
  # can't fill a dropdown at run time, so the options are written into the workflow file and pushed.
  # Needs a WORKFLOW_PAT secret (a token with `workflow` scope): the built-in GITHUB_TOKEN may not
  # change workflow files. The commit is marked [skip ci] and the file is excluded from the push
  # paths above, so it doesn't start another deploy.
  update-commit-dropdown:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: dev
    env:
      FUNCTION_NAME: service-lambda-dev
      TABLE_NAME: rollback-factory-demo-lambda-archive-dev
      WORKFLOW_FILE: .github/workflows/lambda-rollback-to-commit.yml
    steps:
      - name: Check for WORKFLOW_PAT
        id: pat
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          if [[ -z "$WORKFLOW_PAT" ]]; then
            echo "::warning::WORKFLOW_PAT secret is not set, so the lambda rollback to commit dropdown was not updated."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.pat.outputs.available == 'true'
        with:
          ref: main
          token: ${{ secrets.WORKFLOW_PAT }}
      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.pat.outputs.available == 'true'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Regenerate commit options
        if: steps.pat.outputs.available == 'true'
        run: |
          set -euo pipefail
          aws dynamodb query --table-name "$TABLE_NAME" --consistent-read \
            --key-condition-expression 'functionName = :f AND begins_with(sk, :prefix)' \
            --expression-attribute-values "{\":f\":{\"S\":\"$FUNCTION_NAME\"},\":prefix\":{\"S\":\"VERSION#\"}}" \
            --output json > "$RUNNER_TEMP/versions.json"

          node <<'EOF'
          const fs = require('fs');
          const { Items = [] } = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/versions.json`, 'utf8'));
          // Newest 5 commits that went live in dev; each option is the commit "hash subject".
          const options = [...new Set(Items
            .filter((item) => item.liveAt?.S && item.description?.S)
            .sort((a, b) => Number(b.version.N) - Number(a.version.N))
            .map((item) => item.description.S.slice(0, 100)))]
            .slice(0, 5);
          if (options.length === 0) {
            console.log('No deployed commits yet; leaving the dropdown unchanged.');
            process.exit(0);
          }
          const file = process.env.WORKFLOW_FILE;
          const yaml = fs.readFileSync(file, 'utf8');
          const pattern = /(\n( *)# BEGIN generated commit options\n)[\s\S]*?(\n *# END generated commit options)/;
          const match = yaml.match(pattern);
          if (!match) throw new Error(`Generated options markers not found in ${file}`);
          const indent = match[2];
          // JSON strings are valid YAML double-quoted strings, so any commit message is safe.
          const lines = options.map((option) => `${indent}- ${JSON.stringify(option)}`).join('\n');
          fs.writeFileSync(file, yaml.replace(pattern, (_, begin, __, end) => `${begin}${lines}${end}`));
          console.log(`Options:\n${options.join('\n')}`);
          EOF

          if git diff --quiet -- "$WORKFLOW_FILE"; then
            echo "Dropdown already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update lambda rollback to commit options [skip ci]" -- "$WORKFLOW_FILE"
          # main may have moved since this run started.
          git push || { git pull --rebase && git push; }
