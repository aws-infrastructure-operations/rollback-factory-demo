name: rollback-service

# PRs: typecheck, unit tests, synth.
# main / manual, per environment (dev -> prod): deploy the rollback service
# (us-east-1 topic, then the main stack) -> integration tests -> move to the next environment.
# Deploy it before the projects: their alarms publish to its topics, and deploy-aws-lambda's deploy
# invokes it to sync.

on:
  push:
    branches: [main]
    paths:
      - rollback-service/**
      - .github/workflows/rollback-service*.yml
      - .github/actions/rollback-service-deploy/**
      - "!**/*.md"
  pull_request:
    paths:
      - rollback-service/**
      - .github/workflows/rollback-service*.yml
      - .github/actions/rollback-service-deploy/**
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      promote_to_prod:
        description: Deploy to prod after the earlier environments are green
        type: boolean
        default: true

# One run of this workflow at a time; a new run waits for the running one. Pull request checks
# have their own group, so they never wait for (or replace) a waiting deploy from main.
concurrency:
  group: rollback-service-${{ github.event_name == 'pull_request' && 'checks' || 'deploy' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rollback-service
    env:
      # no credentials here: synth only needs a region
      AWS_REGION: eu-central-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rollback-service/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Synth dev and prod
        run: |
          npx cdk synth -c env=dev -q -o cdk.out/dev
          npx cdk synth -c env=prod -q -o cdk.out/prod

  deploy-dev:
    name: deploy dev
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    # Shared with cleanup.yml: never two changes to the same environment's service at once.
    concurrency:
      group: rollback-service-deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rollback-service-deploy
        with:
          environment: dev
          aws-region: ${{ vars.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy-prod:
    name: deploy prod
    if: github.event_name == 'push' || inputs.promote_to_prod
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30
    # Shared with cleanup.yml: never two changes to the same environment's service at once.
    concurrency:
      group: rollback-service-deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rollback-service-deploy
        with:
          environment: prod
          aws-region: ${{ vars.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
