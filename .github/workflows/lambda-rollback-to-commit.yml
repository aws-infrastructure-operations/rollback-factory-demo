name: lambda rollback to commit

# Manual rollback of service-lambda-<env>:live to a deployed commit. The commit is resolved to the
# newest version in that environment that was built from it and went live, then
# "lambda rollback by version" runs with that version.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to roll back
        type: choice
        options: [dev, prod]
        default: dev
      commit:
        description: 'Deployed commit to roll back to (last 5 that went live in dev, newest first)'
        type: choice
        required: true
        # The options between the markers are regenerated by the lambda workflow after every deploy
        # to dev from main, from dev's version archive. Don't edit them by hand.
        options:
          # BEGIN generated commit options
          - "(no deployed commits yet)"
          # END generated commit options
      dry_run:
        description: 'Dry run: only list versions and show what would happen, do not roll back'
        type: boolean
        required: false
        default: false

# One run of this workflow at a time; a new run waits for the running one.
concurrency:
  group: lambda-rollback-to-commit
  cancel-in-progress: false

permissions:
  contents: read
  # Read workflow runs, to stop if a deploy is running or queued.
  actions: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    env:
      FUNCTION_NAME: service-lambda-${{ inputs.environment }}
      TABLE_NAME: rollback-factory-demo-lambda-archive-${{ inputs.environment }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # Options look like "abc1234 Fix greeting": a version's description, the commit it was built from.
      # Version numbers differ per environment, so the commit is looked up in the chosen one.
      - name: Resolve commit to a version in ${{ inputs.environment }}
        id: resolve
        env:
          COMMIT_OPTION: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          if [[ ! "$COMMIT_OPTION" =~ ^([0-9a-f]{7,40})\  ]]; then
            echo "::error::'$COMMIT_OPTION' is not a deployed commit. The list is filled after the next deploy to dev from main."
            exit 1
          fi
          HASH="${BASH_REMATCH[1]}"
          VERSION=$(aws dynamodb query --table-name "$TABLE_NAME" --consistent-read \
            --key-condition-expression 'functionName = :f AND begins_with(sk, :prefix)' \
            --expression-attribute-values "{\":f\":{\"S\":\"$FUNCTION_NAME\"},\":prefix\":{\"S\":\"VERSION#\"}}" \
            --output json \
            | jq -r --arg hash "$HASH" '[.Items[] | select((.description.S // "") | startswith($hash + " ")) | select(.liveAt.S != null)
                                         | .version.N | tonumber] | max // empty')
          if [[ -z "$VERSION" ]]; then
            echo "::error::Commit $HASH never went live in ${{ inputs.environment }} (it may not have been promoted that far)."
            exit 1
          fi
          echo "Rolling back $FUNCTION_NAME to \`$COMMIT_OPTION\` = version **$VERSION**." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  rollback:
    needs: resolve
    uses: ./.github/workflows/lambda-rollback-by-version.yml
    with:
      environment: ${{ inputs.environment }}
      target_version: ${{ needs.resolve.outputs.version }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
