name: frontend

# PRs: typecheck, unit tests, app build, synth.
# main / manual, per environment (dev, then prod): cdk deploy (keeps the live release) ->
# build + upload a release -> activate it -> integration tests -> verified. If the tests fail,
# the environment is switched back to the release it served before and the run stops.
# Alarms after a deploy are handled in AWS (4xx/5xx alarm -> SNS -> rollback Lambda), not here.

on:
  push:
    branches: [main]
    paths:
      - deploy-aws-cloudfront/**
      - .github/workflows/frontend*.yml
      - "!**/*.md"
  pull_request:
    paths:
      - deploy-aws-cloudfront/**
      - .github/workflows/frontend*.yml
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      promote_to_prod:
        description: Deploy to prod after dev is green
        type: boolean
        default: true

# One run of this workflow at a time; a new run waits for the running one. Pull request checks
# have their own group, so they never wait for (or replace) a waiting deploy from main.
concurrency:
  group: frontend-${{ github.event_name == 'pull_request' && 'checks' || 'deploy' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy-aws-cloudfront
    env:
      # no credentials here: synth only needs a region, so the cross-region reference is exercised
      AWS_REGION: eu-central-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy-aws-cloudfront/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: App build
        env:
          VITE_ENV: ci
          VITE_RELEASE_ID: ci
        run: npm run app:build
      - name: Synth dev and prod
        run: |
          npx cdk synth -c env=dev -q -o cdk.out/dev
          npx cdk synth -c env=prod -q -o cdk.out/prod

  deploy-dev:
    if: github.event_name != 'pull_request'
    needs: test
    uses: ./.github/workflows/frontend-deploy.yml
    with:
      environment: dev
    secrets: inherit

  deploy-prod:
    if: github.event_name == 'push' || inputs.promote_to_prod
    needs: deploy-dev
    uses: ./.github/workflows/frontend-deploy.yml
    with:
      environment: prod
    secrets: inherit
