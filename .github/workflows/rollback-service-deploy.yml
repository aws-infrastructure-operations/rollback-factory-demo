name: rollback-service-deploy

# Reusable: deploys one environment of the rollback service (rollback-service-us-east-1-<env>, then
# rollback-service-<env>), runs its integration tests, and fails the job if they fail, which stops
# the later environments.
# Needs, per GitHub environment: secrets.AWS_ACCESS_KEY_ID, secrets.AWS_SECRET_ACCESS_KEY, vars.AWS_REGION

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    # Shared with cleanup.yml: never two changes to the same environment's service at once.
    concurrency:
      group: rollback-service-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: rollback-service
    env:
      ROLLBACK_ENV: ${{ inputs.environment }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rollback-service/package-lock.json
      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: CDK bootstrap, main region and us-east-1 (no-op when up to date)
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          npx cdk bootstrap -c env="$ROLLBACK_ENV" "aws://$account/$AWS_REGION" "aws://$account/us-east-1"

      - name: Deploy (us-east-1 topic first, then the main stack)
        run: npx cdk deploy --all -c env="$ROLLBACK_ENV" --require-approval never

      - name: Integration tests
        id: integration
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee integration-tests.log

      - name: Integration test failures -> job summary
        if: failure() && steps.integration.outcome == 'failure'
        run: |
          {
            echo "### :x: rollback service ($ROLLBACK_ENV): integration tests failed"
            echo "The later environments are not deployed."
            echo '```'
            tail -n 100 integration-tests.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
