name: api-gateway

# PRs: typecheck, unit tests, synth, collection check.
# main / manual, per environment (dev, then prod): deploy to the "integration" stage ->
# integration tests -> promote to stage v1. Failed tests stop the run with v1 untouched.
# Alarms after a deploy are handled in AWS (4xx/5xx alarm -> SNS -> rollback Lambda), not by the workflow.

on:
  push:
    branches: [main]
    paths:
      - aws-api-gateway/**
      - .github/workflows/api-gateway*.yml
      - "!**/*.md"
  pull_request:
    paths:
      - aws-api-gateway/**
      - .github/workflows/api-gateway*.yml
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      promote_to_prod:
        description: Deploy to prod after dev is green
        type: boolean
        default: true
      dev_chaos_failure_rate:
        description: "Demo only: share of dev requests to fail with 500 (0..1) - fails the integration tests, v1 stays as it is"
        type: string
        default: "0"

# One run of this workflow at a time; a new run waits for the running one. Pull request checks
# have their own group, so they never wait for (or replace) a waiting deploy from main.
concurrency:
  group: api-gateway-${{ github.event_name == 'pull_request' && 'checks' || 'deploy' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws-api-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: aws-api-gateway/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Synth dev and prod
        run: |
          npx cdk synth -c env=dev -q -o cdk.out/dev
          npx cdk synth -c env=prod -q -o cdk.out/prod
      - name: Bruno collection matches the API
        run: |
          npm run collection:sync -- --env dev
          changes=$(git status --porcelain -- bruno ':!bruno/environments')
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::Bruno requests are out of date - run 'npm run collection:sync' and commit"
            exit 1
          fi

  deploy-dev:
    if: github.event_name != 'pull_request'
    needs: test
    uses: ./.github/workflows/api-gateway-deploy.yml
    with:
      environment: dev
      chaos_failure_rate: ${{ inputs.dev_chaos_failure_rate || '0' }}
    secrets: inherit
  
  deploy-testing:
    if: github.event_name != 'pull_request'
    needs: deploy-dev
    uses: ./.github/workflows/api-gateway-deploy.yml
    with:
      environment: testing
      chaos_failure_rate: ${{ inputs.dev_chaos_failure_rate || '0' }}
    secrets: inherit
  
  deploy-staging:
    if: github.event_name != 'pull_request'
    needs: deploy-testing
    uses: ./.github/workflows/api-gateway-deploy.yml
    with:
      environment: staging
      chaos_failure_rate: ${{ inputs.dev_chaos_failure_rate || '0' }}
    secrets: inherit

  deploy-prod:
    if: github.event_name == 'push' || inputs.promote_to_prod
    needs: deploy-staging
    uses: ./.github/workflows/api-gateway-deploy.yml
    with:
      environment: prod
    secrets: inherit
