name: api-gateway-deploy
description: Deploy one environment of the api-user API (used by .github/workflows/api-gateway.yml)

# Composite action: deploys one environment of the api-user stack to its "integration" stage,
# runs the integration tests there and only then promotes it to stage v1. If the tests
# fail, v1 is left untouched and the job stops with the failures in the summary.
#
# The calling job checks out the repository, sets runs-on, the GitHub environment,
# timeout and concurrency, and passes the AWS credentials: actions see neither secrets nor vars.

inputs:
  environment:
    description: dev or prod
    required: true
  chaos_failure_rate:
    description: "Demo only: share of requests the backends fail with a 500 (0..1)"
    required: false
    default: "0"
  aws-region:
    description: vars.AWS_REGION of the environment
    required: true
  aws-access-key-id:
    description: secrets.AWS_ACCESS_KEY_ID of the environment
    required: true
  aws-secret-access-key:
    description: secrets.AWS_SECRET_ACCESS_KEY of the environment
    required: true

runs:
  using: composite
  steps:
    # what the workflow job used to set in env:, for every step below
    - name: Environment
      shell: bash
      run: |
        {
          echo "API_ENV=${{ inputs.environment }}"
          echo "AWS_REGION=${{ inputs.aws-region }}"
          echo "CHAOS_FAILURE_RATE=${{ inputs.chaos_failure_rate }}"
          # the environment's shared API domain (deploy-aws-dns-api-domains); prod has no prefix
          if [[ "${{ inputs.environment }}" == prod ]]; then
            echo "API_DOMAIN=api.rollback.ionuteliantudor.com"
          else
            echo "API_DOMAIN=api.${{ inputs.environment }}.rollback.ionuteliantudor.com"
          fi
        } >> "$GITHUB_ENV"
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: deploy-aws-api-gateway/package-lock.json
    - run: npm ci
      shell: bash
      working-directory: deploy-aws-api-gateway

    - uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - name: CDK bootstrap (no-op when up to date)
      run: npx cdk bootstrap -c env="$API_ENV"
      shell: bash
      working-directory: deploy-aws-api-gateway

    - name: Create / update Bruno collection
      run: npm run collection:sync -- --env "$API_ENV"
      shell: bash
      working-directory: deploy-aws-api-gateway

    - name: Read what stage v1 serves
      id: live
      run: |
        context="$(npm run -s live:context -- --env "$API_ENV")"
        echo "context=$context" >> "$GITHUB_OUTPUT"
      shell: bash
      working-directory: deploy-aws-api-gateway

    # The stack maps its stages on the API domain, which the dns workflow creates. When a change
    # to both lands at once, both workflows start together: wait for the domain instead of failing.
    - name: Wait for the API domain (deploy-aws-dns-api-domains)
      run: |
        for attempt in $(seq 1 40); do
          if aws apigateway get-domain-name --domain-name "$API_DOMAIN" >/dev/null 2>&1; then
            echo "$API_DOMAIN exists"; exit 0
          fi
          echo "waiting for $API_DOMAIN (the dns workflow creates it) ... $attempt/40"
          sleep 30
        done
        echo "::error::API domain $API_DOMAIN not found: run the dns workflow first (deploy-aws-dns-api-domains)"
        exit 1
      shell: bash

    - name: Deploy to the integration stage (v1 and its Lambda alias stay as they are)
      env:
        LIVE_CONTEXT: ${{ steps.live.outputs.context }}
      # LIVE_CONTEXT is unquoted on purpose: it holds several -c arguments.
      # deployId: every deploy publishes a new version of both backends, even without code changes.
      run: >-
        npx cdk deploy -c env="$API_ENV" -c chaosFailureRate="$CHAOS_FAILURE_RATE"
        -c deployId="$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
        $LIVE_CONTEXT
        --require-approval never
      shell: bash
      working-directory: deploy-aws-api-gateway

    - name: Upload Bruno collection
      uses: actions/upload-artifact@v7
      with:
        name: bruno-${{ inputs.environment }}
        path: deploy-aws-api-gateway/bruno/

    - name: Integration tests (stage integration)
      id: integration
      env:
        API_STAGE: integration
      run: |
        set -o pipefail
        npm run test:integration 2>&1 | tee integration-tests.log
      shell: bash
      working-directory: deploy-aws-api-gateway

    - name: Promote to stage v1
      run: npm run -s deployment:promote -- --env "$API_ENV"
      shell: bash
      working-directory: deploy-aws-api-gateway

    # Not a gate: v1 is already promoted. Without a token the API answers 401, which proves the
    # mapping user/v1 reaches it; anything else is a warning (e.g. DNS not delegated yet).
    - name: Check the custom domain (https://${{ env.API_DOMAIN }}/user/v1/users)
      run: |
        status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://$API_DOMAIN/user/v1/users" || true)
        if [[ "$status" == 401 ]]; then
          echo "https://$API_DOMAIN/user/v1/users -> 401 without a token, as expected"
        else
          echo "::warning::https://$API_DOMAIN/user/v1/users answered '$status', expected 401"
        fi
      shell: bash

    - name: Record deployment (OpenAPI spec -> S3, record -> DynamoDB)
      run: npm run -s deployment:record -- --env "$API_ENV" --description "GitHub run $GITHUB_RUN_ID ($GITHUB_REF_NAME)"
      shell: bash
      working-directory: deploy-aws-api-gateway

    - name: Mark deployment verified (rollbacks only restore verified deployments)
      run: npm run -s deployment:verify -- --env "$API_ENV"
      shell: bash
      working-directory: deploy-aws-api-gateway

    # The backends are registered in rollback-service/rollback-config.json: archive their new
    # versions and record the promotion (liveAt), so their errors alarms can roll live back.
    - name: Sync the rollback service's version archive (users, messages and orders backends)
      run: |
        set -euo pipefail
        for backend in users messages orders; do
          fn="rollback-factory-demo-api-$backend-$API_ENV"
          FUNCTION_ERROR=$(aws lambda invoke --function-name "rollback-factory-demo-rollback-service-$API_ENV" \
            --cli-binary-format raw-in-base64-out --cli-read-timeout 150 \
            --payload "{\"type\":\"sync\",\"functionName\":\"$fn\"}" \
            --query 'FunctionError' --output text "$RUNNER_TEMP/sync-$backend.json")
          cat "$RUNNER_TEMP/sync-$backend.json"; echo
          if [[ "$FUNCTION_ERROR" != "None" ]] || jq -e 'any(.[]; .synced != true)' "$RUNNER_TEMP/sync-$backend.json" >/dev/null; then
            echo "::error::Sync of $fn failed: $(cat "$RUNNER_TEMP/sync-$backend.json")"
            exit 1
          fi
        done
      shell: bash
      working-directory: deploy-aws-api-gateway

    - name: Integration test failures -> job summary
      if: failure() && steps.integration.outcome == 'failure'
      run: |
        {
          echo "### :x: api-user-$API_ENV: integration tests failed on stage \`integration\`"
          echo "Stage \`v1\` was not changed and nothing was promoted."
          echo '<details open><summary>Test output (last 100 lines)</summary>'
          echo
          echo '```'
          tail -n 100 integration-tests.log
          echo '```'
          echo '</details>'
        } >> "$GITHUB_STEP_SUMMARY"
      shell: bash
      working-directory: deploy-aws-api-gateway

    - name: Deployment history
      if: always() && steps.integration.outcome != 'skipped'
      run: |
        {
          echo "### api-user-$API_ENV deployments"
          echo '```'
          npm run -s deployment:list -- --env "$API_ENV" --limit 5
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
      shell: bash
      working-directory: deploy-aws-api-gateway
